[package]
name = "minwgsl"
version = "1.0.3"
authors = ["robertpakalns"]
edition = "2024"
description = "WGSL minifier written in Rust"
repository = "https://github.com/robertpakalns/minwgsl"
license-file = "./LICENSE"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
debug = false
debug-assertions = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hashbrown = { version = "0.16.1", default-features = false }
naga = { version = "29.0.0", git = "https://github.com/gfx-rs/wgpu.git", rev = "73600f11d7f071f85ac38de473a5f96f2d343f10", default-features = false, features = [
  "wgsl-in",
  "wgsl-out",
] }
wasm-bindgen = { version = "0.2.114", default-features = false }
wee_alloc = { version = "0.4.5", default-features = false }
